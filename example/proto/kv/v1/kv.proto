syntax = "proto3";

package example.kv.v1;

option go_package = "github.com/brotherlogic/speculate/example/proto/kv/v1";

// KV provides basic key-value storage operations.
service KV {
  // Put associates a byte payload with the given key.
  rpc Put(PutRequest) returns (PutResponse);

  // Get retrieves the byte payload for the given key, or returns NOT_FOUND.
  rpc Get(GetRequest) returns (GetResponse);
}

message PutRequest {
  string key = 1;
  bytes value = 2;
}

message PutResponse {}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bytes value = 1;
}
