apiVersion: v1
kind: Service
metadata:
  name: speculate
  namespace: speculate
  labels:
    app: speculate
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051
  selector:
    app: speculate
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: speculate
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
  namespaceSelector:
    matchNames:
      - speculate
  selector:
    matchLabels:
      app: speculate
